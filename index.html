<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Arsip Surat PUPR Madiun</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; position: relative; }
    body::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('images/begron.png') no-repeat center center; background-size: cover; opacity: 0.1; z-index: 0; }
    .login-container { background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; text-align: center; z-index: 1; }
    .logo { width: 80px; margin-bottom: 20px; }
    h2 { color: #333; margin-top: 0; margin-bottom: 10px; font-weight: 700; }
    p { color: #666; margin-bottom: 30px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #555; }
    .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #0057a8; color: white; font-weight: 600; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background-color 0.3s ease; }
    button:hover { background-color: #004180; }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="images/begron.png" alt="Logo PUPR" class="logo">
    <h2>Selamat Datang</h2>
    <p>Aplikasi Arsip Surat Keluar<br>Dinas PUPR Kabupaten Madiun</p>
    <form onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label for="username">Nama Pengguna</label>
        <input type="text" id="username" placeholder="Masukkan nama pengguna" required />
      </div>
      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" placeholder="Masukkan kata sandi" required />
      </div>
      <div class="form-group">
        <label for="role">Peran</label>
        <select id="role" required>
          <option value="" disabled selected>-- Pilih Peran --</option>
          <option value="admin">Admin</option>
          <option value="user">User</option>
        </select>
      </div>
      <button type="submit">Masuk</button>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const validUsers = {
        admin: { password: "admin123", role: "admin" },
        user: { password: "user123", role: "user" }
      };
      if (validUsers[username] && validUsers[username].password === password && validUsers[username].role === role) {
        sessionStorage.setItem("loggedInRole", role);
        sessionStorage.setItem("loggedInUser", username);
        window.location.href = "dashboard.html";
      } else {
        alert("Nama pengguna, kata sandi, atau peran salah!");
      }
    }
  </script>
</body>
</html>
